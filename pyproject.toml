[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-pytest"
version = "0.1.0"
description = "Pet project with pytest"
requires-python = ">=3.11"

[tool.pytest.ini_options]
addopts = "-v --import-mode=importlib"
testpaths = ["tests"]
